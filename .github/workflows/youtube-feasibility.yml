name: YouTube browser feasibility
on:
  push:
    branches: [feasibility/youtube-import-20261024]
permissions:
  contents: read
jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare ordinary anonymous browser
        run: |
          mkdir -p "$RUNNER_TEMP/browser-probe"
          npm install --prefix "$RUNNER_TEMP/browser-probe" --no-save playwright
          printf 'CHROME_BIN=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check playback without login or cookies
        run: |
          cat > "$RUNNER_TEMP/browser-probe/probe.mjs" <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN});
          const results=[];
          try {
           for(const id of ['6esoZ3MZMq4','82p6wSWJ9Xg']) {
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            try {
             await page.goto('https://www.youtube.com/watch?v='+id,{waitUntil:'domcontentloaded',timeout:30000});
             const reject=page.getByRole('button',{name:/Reject all/i});if(await reject.count())await reject.first().click();
             await page.locator('video').first().waitFor({timeout:10000});
             await page.evaluate(()=>document.querySelector('video')?.play().catch(()=>{}));
             await page.waitForFunction(()=>{const video=document.querySelector('video');return (video?.readyState>=2&&video.videoWidth>0)||document.querySelector('yt-playability-error-supported-renderers');},{},{timeout:20000}).catch(()=>{});
             const info=await page.evaluate(()=>{const video=document.querySelector('video');return {title:document.title,duration:video?.duration||null,width:video?.videoWidth||0,height:video?.videoHeight||0,currentTime:video?.currentTime||0,readyState:video?.readyState||0,adShowing:!!document.querySelector('.ad-showing'),playerError:document.querySelector('yt-playability-error-supported-renderers')?.innerText||null};});
             if(info.width>0&&!info.adShowing) {
              await page.evaluate(()=>{const video=document.querySelector('video');video.currentTime=45;video.pause();});
              await page.waitForFunction(()=>{const v=document.querySelector('video');return v?.currentTime>=44&&v.readyState>=2;},{},{timeout:15000});
              info.frameScreenshotBytes=(await page.locator('video').first().screenshot()).length;
             }
             results.push({video_id:id,...info});
            }catch(error){results.push({video_id:id,error:error.message});}finally{await page.close();}
           }
          }finally{await browser.close();}
          console.log('BROWSER_RESULTS='+JSON.stringify(results));
          JS
          node "$RUNNER_TEMP/browser-probe/probe.mjs"
